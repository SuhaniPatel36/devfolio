<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8,6"/>
  
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="88" fill="url(#avatarGrad)"/>
  
  <!-- Subtle inner geometric grid -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="1">
    <circle cx="100" cy="100" r="60" fill="none"/>
    <circle cx="100" cy="100" r="35" fill="none"/>
    <line x1="100" y1="12" x2="100" y2="188"/>
    <line x1="12" y1="100" x2="188" y2="100"/>
  </g>

  <!-- Monogram Initials 'SP' -->
  <text x="100" y="118" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">SP</text>

  <!-- Small Code Pill Badge -->
  <rect x="58" y="140" width="84" height="22" rx="11" fill="#D97706"/>
  <text x="100" y="155" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#FFFFFF">REACT DEV</text>
</svg>
