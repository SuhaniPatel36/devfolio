<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nlBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="nlShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nlBgGrad)"/>

  <!-- Neural Net nodes background accent -->
  <g opacity="0.1" stroke="#4F46E5" stroke-width="1.2" fill="none">
    <line x1="100" y1="100" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="500" y2="120"/>
    <line x1="500" y1="120" x2="700" y2="220"/>
    <line x1="200" y1="350" x2="400" y2="280"/>
    <line x1="400" y1="280" x2="650" y2="340"/>
    <circle cx="100" cy="100" r="4" fill="#4F46E5"/>
    <circle cx="300" cy="180" r="5" fill="#4F46E5"/>
    <circle cx="500" cy="120" r="4" fill="#4F46E5"/>
    <circle cx="700" cy="220" r="5" fill="#4F46E5"/>
    <circle cx="200" cy="350" r="4" fill="#4F46E5"/>
    <circle cx="400" cy="280" r="5" fill="#4F46E5"/>
    <circle cx="650" cy="340" r="4" fill="#4F46E5"/>
  </g>

  <!-- Browser Window -->
  <g filter="url(#nlShadow)">
    <rect x="50" y="40" width="700" height="370" rx="14" fill="#FFFFFF" stroke="#E0E7FF" stroke-width="1.5"/>
    
    <!-- Top bar -->
    <path d="M 50 54 A 14 14 0 0 1 64 40 L 736 40 A 14 14 0 0 1 750 54 L 750 78 L 50 78 Z" fill="#F8FAFC"/>
    <line x1="50" y1="78" x2="750" y2="78" stroke="#E0E7FF" stroke-width="1"/>
    
    <circle cx="76" cy="59" r="5" fill="#EF4444"/>
    <circle cx="94" cy="59" r="5" fill="#F59E0B"/>
    <circle cx="112" cy="59" r="5" fill="#10B981"/>

    <rect x="140" y="49" width="360" height="20" rx="6" fill="#EEF2FF"/>
    <text x="154" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#4F46E5" font-weight="500">neurolearn-ai.edu/student/assessment</text>

    <!-- Microservice Pill -->
    <rect x="590" y="49" width="140" height="20" rx="10" fill="#EEF2FF"/>
    <circle cx="603" cy="59" r="3.5" fill="#4F46E5"/>
    <text x="614" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#3730A3" font-weight="600">FLASK AI MICROSERVICE</text>
  </g>

  <!-- Left: Assessment Workspace & Real-time AI Risk Evaluator -->
  <g>
    <rect x="75" y="96" width="410" height="290" rx="8" fill="#FBFBFE" stroke="#E0E7FF" stroke-width="1"/>
    <text x="95" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#1E1B4B" font-weight="700">Adaptive Diagnostic Assessment Engine</text>

    <!-- Question Card -->
    <rect x="95" y="142" width="370" height="110" rx="6" fill="#FFFFFF" stroke="#EEF2FF" stroke-width="1"/>
    <text x="110" y="165" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#4338CA" font-weight="600">Question 14 of 25 • CS Algorithms & Complexity</text>
    <text x="110" y="188" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#1F2937">What is the amortized time complexity of dynamic array resizing?</text>
    
    <rect x="110" y="202" width="165" height="34" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
    <circle cx="125" cy="219" r="5" fill="#16A34A"/>
    <text x="138" y="223" font-family="JetBrains Mono, monospace" font-size="11" fill="#166534" font-weight="700">O(1) Amortized ✓</text>

    <rect x="290" y="202" width="165" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="305" cy="219" r="5" fill="#CBD5E1"/>
    <text x="318" y="223" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">O(n) Worst-case</text>

    <!-- Architecture flow snippet -->
    <rect x="95" y="265" width="370" height="105" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="110" y="286" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#312E81" font-weight="700">MERN ⇄ Python Flask Interoperability</text>
    <text x="110" y="306" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#4B5563">1. React Frontend submits response array to Node.js backend</text>
    <text x="110" y="324" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#4B5563">2. Node.js orchestrates Flask AI endpoint for Bayesian risk rating</text>
    <text x="110" y="342" font-family="JetBrains Mono, monospace" font-size="10" fill="#4F46E5" font-weight="600">3. Real-time confidence score returned in &lt;65ms</text>
  </g>

  <!-- Right: AI Risk Gauge & Analytics -->
  <g>
    <rect x="500" y="96" width="225" height="290" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="515" y="125" font-family="Plus Jakarta Sans, sans-serif" font-size="12" fill="#0F172A" font-weight="700">AI Risk Scoring Matrix</text>

    <!-- Circular Score Gauge -->
    <g transform="translate(612, 195)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#E2E8F0" stroke-width="10"/>
      <path d="M 0 -48 A 48 48 0 1 1 -42 22" fill="none" stroke="#4F46E5" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="2" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="20" fill="#0F172A" font-weight="800">92%</text>
      <text x="0" y="18" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#10B981" font-weight="600">Low Risk</text>
    </g>

    <!-- Details -->
    <rect x="515" y="260" width="195" height="34" rx="4" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <text x="525" y="278" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Prediction Model</text>
    <text x="695" y="278" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="#4F46E5" font-weight="700">Random Forest</text>
    <text x="525" y="290" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#94A3B8">Flask REST API Service</text>

    <rect x="515" y="302" width="195" height="34" rx="4" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <text x="525" y="320" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Dashboard Sync</text>
    <text x="695" y="320" text-anchor="end" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#16A34A" font-weight="700">Real-time</text>
    <text x="525" y="332" font-family="Plus Jakarta Sans, sans-serif" font-size="8" fill="#94A3B8">Mongoose ODM Pipeline</text>

    <!-- Verified badge -->
    <rect x="515" y="346" width="195" height="26" rx="4" fill="#1E1B4B"/>
    <text x="612" y="363" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="9" fill="#E0E7FF" font-weight="600">✓ Academic Research Verified</text>
  </g>
</svg>
