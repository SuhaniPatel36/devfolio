<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.8"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>

  <!-- Mockup Window Card -->
  <g filter="url(#shadow)">
    <rect x="50" y="40" width="700" height="370" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <path d="M 50 54 A 14 14 0 0 1 64 40 L 736 40 A 14 14 0 0 1 750 54 L 750 78 L 50 78 Z" fill="#F8FAFC"/>
    <line x1="50" y1="78" x2="750" y2="78" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Dots -->
    <circle cx="76" cy="59" r="5" fill="#EF4444"/>
    <circle cx="94" cy="59" r="5" fill="#F59E0B"/>
    <circle cx="112" cy="59" r="5" fill="#10B981"/>
    
    <!-- URL Bar -->
    <rect x="140" y="49" width="360" height="20" rx="6" fill="#EDF2F7"/>
    <text x="154" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" font-weight="500">bizsuite-enterprise.internal/analytics</text>

    <!-- Status Pill -->
    <rect x="620" y="49" width="105" height="20" rx="10" fill="#DCFCE7"/>
    <circle cx="633" cy="59" r="3.5" fill="#16A34A"/>
    <text x="644" y="63" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#166534" font-weight="600">+85.6% GAIN</text>
  </g>

  <!-- Sidebar Inside Mockup -->
  <rect x="65" y="92" width="130" height="300" rx="8" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1"/>
  <rect x="80" y="110" width="100" height="12" rx="4" fill="#1E3A8A"/>
  <rect x="80" y="136" width="75" height="8" rx="3" fill="#94A3B8"/>
  <rect x="80" y="156" width="85" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="176" width="60" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="196" width="70" height="8" rx="3" fill="#CBD5E1"/>
  <rect x="80" y="216" width="80" height="8" rx="3" fill="#CBD5E1"/>

  <!-- Top Metric Cards -->
  <g>
    <!-- Card 1 -->
    <rect x="210" y="96" width="155" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="224" y="118" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" font-weight="600">INVENTORY EFFICIENCY</text>
    <text x="224" y="146" font-family="JetBrains Mono, monospace" font-size="20" fill="#0F172A" font-weight="700">85.6%</text>
    <rect x="300" y="130" width="50" height="18" rx="4" fill="#FEF3C7"/>
    <text x="307" y="143" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#B45309" font-weight="700">▲ Peak</text>

    <!-- Card 2 -->
    <rect x="380" y="96" width="155" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="394" y="118" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" font-weight="600">WORKFLOW CYCLES</text>
    <text x="394" y="146" font-family="JetBrains Mono, monospace" font-size="20" fill="#0F172A" font-weight="700">1,420</text>
    <rect x="475" y="130" width="48" height="18" rx="4" fill="#DBEAFE"/>
    <text x="482" y="143" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#1D4ED8" font-weight="700">Live</text>

    <!-- Card 3 -->
    <rect x="550" y="96" width="175" height="74" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="564" y="118" font-family="Plus Jakarta Sans, sans-serif" font-size="11" fill="#64748B" font-weight="600">ROLE-BASED AUTH</text>
    <text x="564" y="146" font-family="JetBrains Mono, monospace" font-size="15" fill="#1E3A8A" font-weight="700">RBAC Enabled</text>
  </g>

  <!-- Large Chart Area -->
  <rect x="210" y="184" width="515" height="205" rx="8" fill="#FAFAFA" stroke="#E2E8F0" stroke-width="1"/>
  <text x="230" y="212" font-family="Plus Jakarta Sans, sans-serif" font-size="13" fill="#1E293B" font-weight="700">Enterprise Resource Distribution & Tracking</text>
  
  <!-- Bars in Chart -->
  <g>
    <!-- Bar 1 -->
    <rect x="250" y="290" width="36" height="75" rx="4" fill="#E2E8F0"/>
    <rect x="250" y="320" width="36" height="45" rx="4" fill="url(#barGrad)"/>
    <text x="254" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Q1-24</text>

    <!-- Bar 2 -->
    <rect x="315" y="260" width="36" height="105" rx="4" fill="#E2E8F0"/>
    <rect x="315" y="280" width="36" height="85" rx="4" fill="url(#barGrad)"/>
    <text x="319" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Q2-24</text>

    <!-- Bar 3 -->
    <rect x="380" y="240" width="36" height="125" rx="4" fill="#E2E8F0"/>
    <rect x="380" y="250" width="36" height="115" rx="4" fill="url(#barGrad)"/>
    <text x="384" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Q3-24</text>

    <!-- Bar 4 (Highlighted) -->
    <rect x="445" y="220" width="36" height="145" rx="4" fill="#FEF3C7"/>
    <rect x="445" y="225" width="36" height="140" rx="4" fill="url(#accentGrad)"/>
    <text x="449" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#B45309" font-weight="700">Q4-24</text>

    <!-- Bar 5 -->
    <rect x="510" y="235" width="36" height="130" rx="4" fill="#E2E8F0"/>
    <rect x="510" y="245" width="36" height="120" rx="4" fill="url(#barGrad)"/>
    <text x="514" y="380" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#64748B">Q1-25</text>
  </g>

  <!-- Clean Floating Callout Badge -->
  <g filter="url(#shadow)">
    <rect x="575" y="230" width="135" height="60" rx="8" fill="#1E3A8A"/>
    <text x="589" y="252" font-family="Plus Jakarta Sans, sans-serif" font-size="10" fill="#93C5FD" font-weight="600">REST API LATENCY</text>
    <text x="589" y="275" font-family="JetBrains Mono, monospace" font-size="18" fill="#FFFFFF" font-weight="700">42ms</text>
  </g>
</svg>
